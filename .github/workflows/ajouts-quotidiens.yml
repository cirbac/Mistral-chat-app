name: Ajouts quotidiens (lot auto)

on:
  schedule:
    - cron: '30 6 * * *'
  workflow_dispatch:
    inputs:
      n:
        description: 'Nombre de marques à ajouter (défaut 6)'
        required: false
        default: '6'

permissions:
  contents: write
  pull-requests: write

jobs:
  lot-auto:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Identité git du bot
        run: |
          git config user.name "vibe-bot"
          git config user.email "vibe-bot@mistral.ai"

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        working-directory: consommer-europeen
        run: npm ci

      - name: Générer le lot du jour + valider (check:data, tsc, tests 67/67)
        working-directory: consommer-europeen
        env:
          LOT_DIRECT_MAIN: '1'
        run: node tools/lot-quotidien.mjs --n "${{ inputs.n || '6' }}"

      - name: Push direct sur main (CI tourne sur push)
        run: |
          if git diff --quiet HEAD origin/main -- consommer-europeen/data; then
            echo "Aucun ajout aujourd'hui (plan épuisé) — rien à pousser."
            exit 0
          fi
          if git push origin HEAD:main; then
            echo "Lot poussé directement sur main — CI (push) + Render auto-deploy."
          else
            echo "Push main refusé (protection de branche ?) — on pousse une branche bot/lot-auto pour merge manuel."
            git push -u origin HEAD:bot/lot-auto-$(date +%Y%m%d)
          fi
