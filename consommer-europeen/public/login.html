<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Connexion — Consommer européen · Cirba Consult</title>
    <link rel="icon" type="image/png" href="assets/favicon.png" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body class="login-page">
    <main class="login-card">
      <img class="logo" src="assets/logo-black.png" alt="Cirba Consult" />
      <h1>Consommer européen</h1>
      <p class="sous-titre">Quelle marque, quel modèle — d'où vient-il, qui le détient ?</p>
      <form id="login-form">
        <label for="email">E-mail</label>
        <input id="email" name="email" type="email" autocomplete="username" required />
        <label for="password">Mot de passe</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required />
        <button type="submit">Se connecter</button>
        <p id="login-error" class="erreur" hidden></p>
      </form>
      <p class="astuce">Compte démo par défaut : <code>demo@consommer-europeen.fr</code> / <code>demo1234</code> (configurable via <code>.env</code>).</p>
    </main>
    <script>
      document.getElementById('login-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const err = document.getElementById('login-error');
        err.hidden = true;
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            email: document.getElementById('email').value,
            password: document.getElementById('password').value,
          }),
        });
        if (res.ok) {
          window.location.href = '/';
        } else {
          const data = await res.json().catch(() => ({}));
          err.textContent = data.error || 'Erreur de connexion.';
          err.hidden = false;
        }
      });
    </script>
  </body>
</html>
